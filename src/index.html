    <script>
      // Resolve theme before first paint to avoid a light-mode flash.
      // Stored preference wins; otherwise inherit from the browser and
      // default to dark when no system preference is expressed.
      (function () {
        try {
          var stored = localStorage.getItem('markflow-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          if (!mode) {
            var prefersLight =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches;
            mode = prefersLight ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

  <body class="bg-stone-50">
